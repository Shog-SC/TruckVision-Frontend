<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>TruckVision Live Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f172a;
            font-family: system-ui, sans-serif;
            color: #f8fafc;
        }

        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar (à gauche) */
        #sidebar {
            width: 340px;
            background: #1e293b;
            border-right: 1px solid #334155;
            padding: 15px;
            overflow-y: auto;
        }

        #sidebar h1 {
            margin-top: 0;
            font-size: 22px;
            color: #38bdf8;
            text-align: center;
        }

        /* Button Auto Center */
        #tv-autocenter-toggle {
            width: 100%;
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        #tv-autocenter-toggle:hover {
            background: #475569;
        }

        /* Titles */
        .tv-section-title {
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 16px;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        /* Stats entries */
        .tv-stat {
            font-size: 14px;
            margin-bottom: 6px;
        }

        /* Player list */
        #tv-players {
            margin-top: 10px;
            padding-bottom: 30px;
        }

        .tv-player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: #303c52;
            border-radius: 5px;
            margin-bottom: 6px;
        }

        .tv-player-name {
            font-weight: 600;
        }

        .tv-player-me {
            color: #38bdf8;
        }

        .tv-badge {
            padding: 2px 6px;
            background: #475569;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }

        .tv-badge.me {
            background: #0ea5e9;
            color: #0f172a;
        }

        .tv-player-speed {
            font-size: 14px;
        }

        /* Map */
        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        /* Truck icons */
        .tv-truck-icon {
            font-size: 20px;
        }

        .tv-truck-me {
            color: #38bdf8;
            text-shadow: 0 0 4px #0ea5e9;
        }

        .tv-truck-other {
            color: #e2e8f0;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="container">

        <!-- SIDEBAR -->
        <div id="sidebar">
            <h1>TruckVision V6</h1>

            <!-- Auto Center Button -->
            <button id="tv-autocenter-toggle">Auto Center: ON</button>

            <!-- My Stats -->
            <div id="tv-me-stats">
                Chargement camion...
            </div>

            <!-- Other Players -->
            <div class="tv-section-title">Joueurs connectés</div>
            <div id="tv-players"></div>
        </div>

        <!-- MAP -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- TruckVision App -->
    <script src="app.js"></script>

</body>
</html>
